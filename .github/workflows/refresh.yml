name: Refresh data

on:
  workflow_dispatch:
  # schedule:
  #   # Enable when the data source is a live/current season (not this static 2015/16 dump).
  #   - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project and dev dependencies
        run: uv sync --locked

      - name: Refresh player JSON
        run: uv run refresh-data

      - name: Copy JSON into the web app
        run: |
          mkdir -p web/public/data/json
          rm -rf web/public/data/json/v3
          cp -R outputs/json/v3 web/public/data/json/v3

      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/json/v3 web/public/data/json/v3
          if git diff --staged --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "chore: refresh La Liga 2015/16 player JSON"
            git push
          fi
