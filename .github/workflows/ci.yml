name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project and dev dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q
